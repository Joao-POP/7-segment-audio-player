<!doctype html>

<html>
    <head>

        <title>7 Segment Display Audio Player</title>
        <link href="./styles.css" rel="stylesheet" />
        <script src="./dist/main.js" type="module" defer></script>

    <body>
        <div id="player-body">
            <div id="controls">
                <div id="seven-segment">

                <div class="digit">

                </div>
                <div class="digit">
                    <span class="horizontal segment A"></span>
                    <span class="vertical segment B"></span>

                    <span class="horizontal segment D"></span>
                    <span class="vertical segment E"></span>
                    <span class="vertical segment F"></span>
                    <span class="horizontal segment G"></span>

                <div class="digit">

                    <span class="vertical segment B"></span>

                    <span class="vertical segment E"></span>

                <div class="digit">
                    <span class="horizontal segment A"></span>

                    <span class="vertical segment F"></span>
                    <span class="horizontal segment G"></span>
                </div>
                </div>
                <input id="volume-knob" type="range" name="volume" min="0" max="100" />
                <div id="button-array">
                    <button id="play-button"></button>
                    <button id="pause-button"></button>
                    <button id="rewind-button"></button>
                    <button id="fast-forward-button"></button>
                </div>
            </div>
            <input id="cd-tray" type="file" name="song" accept="audio/*" />
        </div>
    </body>
</html>
