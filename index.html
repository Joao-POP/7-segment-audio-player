<!doctype html>

<html>
    <head>
        <meta charset="UTF-8" />
        <title>7 Segment Display Audio Player</title>
        <link href="./styles.css" rel="stylesheet" />
        <script src="./dist/main.js" type="module" defer></script>
    </head>
    <body>
        <div id="player-body">
            <div id="7-segment">
                <div class="digit"></div>
                <div class="digit"></div>
                <div class="digit"></div>
                <div class="digit"></div>
                <div class="digit"></div>
                <div class="digit"></div>
                <div class="digit"></div>
                <div class="digit"></div>
            </div>
            <input id="volume-knob" type="range" name="volume" min="0" max="100" />
            <input id="cd-tray" type="file" name="song" accept="audio/*" />
        </div>
    </body>
</html>
